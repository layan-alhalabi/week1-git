services:
  db:
    image: postgres:16
    container_name: week1-postgres
    restart: always
    environment:
      POSTGRES_USER: trainee
      POSTGRES_PASSWORD: trainee123
      POSTGRES_DB: training_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data: